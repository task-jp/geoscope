name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-smoke:
    name: Backend import + syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Compile-check all Python files
        run: python -m compileall -q backend tools

      - name: Smoke-import FastAPI app
        run: |
          cd backend
          # Stub env so Settings + create_async_engine don't fail.
          # asyncpg is in requirements.txt, so the engine builds lazily without
          # an actual connection (no aiosqlite needed).
          DATABASE_URL=postgresql+asyncpg://stub:stub@localhost:5432/stub \
          VALKEY_URL=redis://localhost:6379/0 \
          SECRET_KEY=ci-only-stub-key-1234567890 \
          python -c "from app.main import app; print('imported:', app.title)"

  compose-validate:
    name: docker-compose syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config --quiet
